[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netstego"
version = "0.1.0"
description = "CLI tool for network packet steganography"
requires-python = ">=3.11"
dependencies = [
    "scapy>=2.5.0",
    "click>=8.1.0",
    "cryptography>=42.0.0",
    "sqlalchemy>=2.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "dpkt>=1.9.8",
    "pyshark>=0.6",
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
netstego = "netstego.cli:cli"

[tool.setuptools.packages.find]
include = ["netstego*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
